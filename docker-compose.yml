# Local dev stack (app + Postgres + Redis).
#
# Security notes (#217, #218, #221):
# - No service is published on 0.0.0.0. Host ports are loopback-only, so the
#   DB and Redis are not reachable off-host. The app talks to them over the
#   Compose network and needs no host port for them at all.
# - Postgres requires a real POSTGRES_PASSWORD (no default). See .env.example.
# - Redis supports REDIS_PASSWORD (requirepass). Set REDIS_PASSWORD and
#   REDIS_URL=redis://:<password>@redis:6379 in .env.local to enable auth.
#   Without it Redis runs without auth, which is only acceptable because the
#   port is loopback-bound in this file.
# - For live servers use docker-compose.prod.yml instead: it publishes no
#   DB/Redis ports at all, requires REDIS_PASSWORD, and gives Postgres
#   shm_size plus CPU/memory guardrails. See docs/production-deploy.md.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-https://your-instance.clerk.accounts.dev/sign-in}
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-https://your-instance.clerk.accounts.dev/sign-up}
      - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-chatbot}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback-only. Remove entirely if you only access Postgres from the app.
    ports:
      - "127.0.0.1:5433:5432"
    # Default Docker /dev/shm (64mb) is too small for Postgres and causes
    # parallel-query and vacuum slowdowns. 256mb matches the prod file (#221).
    shm_size: 256mb
    # Keep noisy neighbours from starving the DB on shared hosts (#221).
    # Compose v2 ignores deploy.resources without Swarm, but Docker Desktop
    # and recent Compose honour cpus/mem_limit below, so set both.
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    # Log checkpoints and autovacuum so host I/O starvation (#221) shows up
    # in docker logs before it becomes bloat.
    command:
      - postgres
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    env_file:
      - .env.local
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Loopback-only. The app reaches Redis over the Compose network, so this
    # mapping can be deleted entirely. Never change it to 0.0.0.0 (#217).
    ports:
      - "127.0.0.1:6380:6379"
    # Enable requirepass when REDIS_PASSWORD is set; run open only for local
    # dev where the port is loopback-bound. Production must set it (#217).
    command:
      - sh
      - -c
      - |
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        else
          echo "WARNING: REDIS_PASSWORD is empty, starting Redis without auth (dev only, loopback-bound)"
          exec redis-server --appendonly yes
        fi
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
