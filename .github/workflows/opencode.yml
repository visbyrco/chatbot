name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Verify user has write access
        uses: actions/github-script@v7
        with:
          script: |
            const allowedPermissions = ['admin', 'maintain', 'write'];
            const allowedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const association = context.payload.comment.author_association;
            const username = context.payload.comment.user.login;
            if (!allowedAssociations.includes(association)) {
              core.setFailed(`Access denied: @${username} has association "${association}". Only users with write access (OWNER/MEMBER/COLLABORATOR) can invoke opencode. CONTRIBUTOR and others are not allowed.`);
              return;
            }
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              if (allowedPermissions.includes(data.permission)) {
                core.info(`Access granted: @${username} has "${data.permission}" permission (${association}).`);
              } else {
                core.setFailed(`Access denied: @${username} has "${data.permission}" permission (${association}). Requires "write" or higher.`);
              }
            } catch (error) {
              core.setFailed(`Access denied: could not verify permission for @${username} (${association}): ${error.message}. Only collaborators with write access can invoke opencode.`);
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/muse-spark-1.3-contributor