name: opencode review

# Custom command-triggered PR review using opencode.
# Comment `/review` or `/oc review` on any pull request to get a full AI review.
# Uses opencode agent via anomalyco/opencode/github action.
# Docs: https://opencode.ai/docs/github#pull-request-example

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-review:
    # Only run on PRs (issue_comment fires for issues too) and when the command is present
    if: |
      (
        github.event_name == 'issue_comment' && github.event.issue.pull_request
        || github.event_name == 'pull_request_review_comment'
      ) && (
        contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/oc review') ||
        contains(github.event.comment.body, '/opencode review')
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Verify user has write access
        uses: actions/github-script@v7
        with:
          script: |
            const allowedPermissions = ['admin', 'maintain', 'write'];
            const allowedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const association = context.payload.comment.author_association;
            const username = context.payload.comment.user.login;
            if (!allowedAssociations.includes(association)) {
              core.setFailed(`Access denied: @${username} has association "${association}". Only users with write access (OWNER/MEMBER/COLLABORATOR) can invoke opencode review. CONTRIBUTOR and others are not allowed.`);
              return;
            }
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              if (allowedPermissions.includes(data.permission)) {
                core.info(`Access granted: @${username} has "${data.permission}" permission (${association}).`);
              } else {
                core.setFailed(`Access denied: @${username} has "${data.permission}" permission (${association}). Requires "write" or higher.`);
              }
            } catch (error) {
              core.setFailed(`Access denied: could not verify permission for @${username} (${association}): ${error.message}. Only collaborators with write access can invoke opencode review.`);
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          # trigger phrases for this workflow - keeps it separate from the default /oc handler
          mentions: "/review,/oc review,/opencode review"
          # plan agent is read-only, best for reviews (no file edits expected)
          agent: plan
          prompt: |
            You are reviewing this pull request. Be a senior reviewer for this Next.js 16 / React 19 / TypeScript / Tailwind / Drizzle codebase.

            Focus on:
            - Bugs, edge cases, and missing error handling (especially API routes in app/(chat)/api/, Drizzle schema in lib/db/schema.ts, auth in app/(auth)/auth.ts and middleware.ts)
            - Security: auth checks, input validation, SQL injection, secrets exposure
            - Correctness: TypeScript types, async handling, Redis/DB failures, provider key handling in lib/ai/providers.ts
            - Code quality: duplication, long functions, missing tests for changes under tests/e2e/
            - Performance: N+1 queries, unnecessary re-renders, bundle size

            How to respond:
            - Post one summary comment with overall verdict (approve / needs changes) and highest priority findings first.
            - Use inline review comments anchored to the changed lines when you have file-specific feedback.
            - Be specific: reference file_path:line_number and suggest concrete fixes with code snippets where helpful.
            - If the PR is small and looks good, say so briefly. Do not invent issues.
            - Do not push commits or edit files. Review only unless the user explicitly asks you to fix something in a follow-up comment.
